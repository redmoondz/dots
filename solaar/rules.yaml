%YAML 1.3
---
- Test: [thumb_wheel_up, 15]
- KeyPress:
  - [Control_L, Tab]
  - click
...
---
- Test: [thumb_wheel_down, 15]
- KeyPress:
  - [Control_L, Shift_L, Tab]
  - click
...
---
- MouseGesture: [Mouse Gesture Button, Mouse Left]
- Execute: [hyprctl, dispatch, 'hl.dsp.focus({ workspace = "-1" })']
...
---
- MouseGesture: [Mouse Gesture Button, Mouse Right]
- Execute: [hyprctl, dispatch, 'hl.dsp.focus({ workspace = "+1" })']
...
