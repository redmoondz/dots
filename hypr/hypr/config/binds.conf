# Define main modifier
$mainMod = SUPER
$ipc = qs -c noctalia-shell ipc call

# MX Master 3S Host Change Button
bind = SUPER, F1, exec, solaar config "MX Master 3S" change-host 2
bind = SUPER, F2, exec, solaar config "MX Master 3S" change-host 1

# ╭─────────────────────────────────────────────────────────────────╮
# │                      Core Applications                          │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod, RETURN, exec, kitty #alacritty
bind = $mainMod, E, exec, nautilus
bind = $mainMod, F, exec, google-chrome-stable #firefox
bind = $mainMod_SHIFT, F, exec, google-chrome-stable --private-window
bind = $mainMod, C, exec, code
bind = $mainMod, T, exec, Telegram
bind = $mainMod, O, exec, obs
bind = $mainMod, S, exec, spotify
bind = $mainMod, Z, exec, datagrip
bind = $mainMod_SHIFT, D, exec, discord

# ╭─────────────────────────────────────────────────────────────────╮
# │                          Menus                                  │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod, D, exec, $ipc launcher toggle
bind = $mainMod, X, exec, $ipc sessionMenu toggle
bind = SUPER_SHIFT, X, exec, $ipc settings toggle
bind = $mainMod, comma, exec, $ipc launcher emoji
bind = $mainMod, V, exec, $ipc launcher clipboard

# ╭─────────────────────────────────────────────────────────────────╮
# │                        Screenshots                             │
# ╰─────────────────────────────────────────────────────────────────╯
# Region screenshot
bind = ALT_SHIFT, 1, exec, mkdir -p ~/Pictures/Screenshots && FILE="$HOME/Pictures/Screenshots/Screenshot-$(date +%F_%H-%M-%S).png" && grim -g "$(slurp)" - | tee >(wl-copy) > "$FILE" && [ -s "$FILE" ] && notify-send -i "$FILE" "Screenshot" "Selected area copied to clipboard and saved"

# Full screen screenshot 
bind = ALT_SHIFT, 2, exec, mkdir -p ~/Pictures/Screenshots && FILE="$HOME/Pictures/Screenshots/Screenshot-$(date +%F_%H-%M-%S).png" && grim - | tee >(wl-copy) > "$FILE" && [ -s "$FILE" ] && notify-send -i "$FILE" "Screenshot" "Full screen copied to clipboard and saved"

# Full screen screenshot and save to clipboard
bind = , Print, exec, grim - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png | dunstify -i ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png "Screenshot of whole screen taken" -t 1000

# ╭─────────────────────────────────────────────────────────────────╮
# │                        Wallpaper                               │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod_CTRL, W, exec, qs -c noctalia-shell ipc call plugin:wallcards toggle

# ╭─────────────────────────────────────────────────────────────────╮
# │                      Window Management                         │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod, Q, killactive,
bind = ALT, F4, killactive,
bind = $mainMod, F11, fullscreen
bind = $mainMod_SHIFT, S, togglefloating,
bind = $mainMod, P, pseudo, # dwindle

# ╭─────────────────────────────────────────────────────────────────╮
# │                         Focus Movement                         │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Alt+Tab functionality
bind = ALT, Tab, cyclenext
bind = $mainMod, Tab, swapnext

# ╭─────────────────────────────────────────────────────────────────╮
# │                         Window Movement                        │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ╭─────────────────────────────────────────────────────────────────╮
# │                         Window Resizing                        │
# ╰─────────────────────────────────────────────────────────────────╯
# Resize active window with Super +/-
binde = $mainMod, equal, resizeactive, 45 45
binde = $mainMod, minus, resizeactive, -45 -45

# ╭─────────────────────────────────────────────────────────────────╮
# │                      Mouse Window Actions                      │
# ╰─────────────────────────────────────────────────────────────────╯
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ╭─────────────────────────────────────────────────────────────────╮
# │                      Volume Controls                           │
# ╰─────────────────────────────────────────────────────────────────╯
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput

# Volume control with GUI
bind = $mainMod_SHIFT, V, exec, pavucontrol

# ╭─────────────────────────────────────────────────────────────────╮
# │                    Brightness Controls                         │
# ╰─────────────────────────────────────────────────────────────────╯
#For laptop brightness keys, use the following binds. Make sure to have brillo installed and configured properly.
# bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
# bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# ╭─────────────────────────────────────────────────────────────────╮
# │                      Media Player Controls                     │
# ╰─────────────────────────────────────────────────────────────────╯
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86audiostop, exec, playerctl stop

# ╭─────────────────────────────────────────────────────────────────╮
# │                      Screen Control                            │
# # ╰─────────────────────────────────────────────────────────────────╯
# bind = $mainMod_SHIFT_ALT, S, exec, sleep 1 && hyprctl dispatch dpms off  # turn off screen
# bind = $mainMod_SHIFT, S, exec, sleep 1 && hyprctl dispatch dpms on       # turn on screen

# ╭─────────────────────────────────────────────────────────────────╮
# │                      Lock Screen                               │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod, L, exec, $ipc lockScreen lock

# ╭─────────────────────────────────────────────────────────────────╮
# │                    Configuration Management                     │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod SHIFT, R, exec, sh ~/.config/hypr/scripts/reload.sh  # reload hyprland config

# ╭─────────────────────────────────────────────────────────────────╮
# │                      Switch Workspaces                         │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# ╭─────────────────────────────────────────────────────────────────╮
# │                    Move Window to Workspace                    │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9

# ╭─────────────────────────────────────────────────────────────────╮
# │                    Scroll Through Workspaces                   │
# ╰─────────────────────────────────────────────────────────────────╯
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

